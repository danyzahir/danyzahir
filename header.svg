<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Grid & Dot Patterns -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.5" fill="#000000" opacity="0.12" />
    </pattern>
    <style>
      .font-black { font-family: 'Space Grotesk', 'Impact', 'Arial Black', sans-serif; font-weight: 900; }
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 800; }
      .font-sans { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Outer Shadow & White Background -->
  <rect x="14" y="14" width="822" height="222" fill="#000000" />
  <rect x="6" y="6" width="822" height="222" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  <rect x="6" y="6" width="822" height="222" fill="url(#dot-grid)" />

  <!-- MAIN CENTERED HERO CARD (ELECTRIC CYAN) -->
  <g transform="translate(35, 26)">
    <!-- Shadow -->
    <rect x="10" y="10" width="760" height="128" fill="#000000" />
    <!-- Main Box (Electric Cyan) -->
    <rect x="0" y="0" width="760" height="128" fill="#00E5FF" stroke="#000000" stroke-width="5" />
    
    <!-- Top Terminal Control Bar -->
    <rect x="0" y="0" width="760" height="32" fill="#000000" />
    <circle cx="18" cy="16" r="6" fill="#FF6B00" />
    <circle cx="36" cy="16" r="6" fill="#FFE600" />
    <circle cx="54" cy="16" r="6" fill="#00FF66" />
    <text x="76" y="21" class="font-mono" font-size="12" fill="#FFFFFF">DANYZAHIR_PROFILE.EXE /// NEO_BRUTALISM /// @danyzcodes</text>

    <!-- Main Title -->
    <text x="30" y="75" class="font-black" font-size="34" fill="#000000" letter-spacing="1">HALO! SAYA DANY ZAHIR</text>
    <!-- Subtitle -->
    <text x="30" y="106" class="font-sans" font-size="16" fill="#000000" letter-spacing="1">FULL-STACK DEVELOPER</text>
  </g>

  <!-- ACTION BUTTONS ROW (NO PINK) -->
  <g transform="translate(35, 172)">
    <!-- Email Button (Deep Purple / Electric Orange) -->
    <a href="mailto:danyzahir@example.com">
      <rect x="4" y="4" width="240" height="44" fill="#000000" />
      <rect x="0" y="0" width="240" height="44" fill="#7000FF" stroke="#000000" stroke-width="4" />
      <!-- Vector Envelope Icon -->
      <path d="M 45 15 H 65 V 27 H 45 Z M 45 15 L 55 22 L 65 15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="140" y="27" class="font-mono" font-size="14" fill="#FFFFFF" text-anchor="middle">EMAIL</text>
    </a>

    <!-- LinkedIn Button (Yellow) -->
    <a href="https://linkedin.com/in/danyzahir">
      <g transform="translate(260, 0)">
        <rect x="4" y="4" width="240" height="44" fill="#000000" />
        <rect x="0" y="0" width="240" height="44" fill="#FFE600" stroke="#000000" stroke-width="4" />
        <!-- Vector LinkedIn Official Logo -->
        <g transform="translate(42, 11) scale(0.82)">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.78a1.62 1.62 0 1 0 0 3.24 1.62 1.62 0 0 0 0-3.24z" fill="#000000" />
        </g>
        <text x="140" y="27" class="font-mono" font-size="14" fill="#000000" text-anchor="middle">LINKEDIN</text>
      </g>
    </a>

    <!-- GitHub Button (Lime Green) -->
    <a href="https://github.com/danyzahir">
      <g transform="translate(520, 0)">
        <rect x="4" y="4" width="240" height="44" fill="#000000" />
        <rect x="0" y="0" width="240" height="44" fill="#00FF66" stroke="#000000" stroke-width="4" />
        <!-- Vector GitHub Official Logo -->
        <g transform="translate(44, 10) scale(0.85)">
          <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z" fill="#000000" />
        </g>
        <text x="140" y="27" class="font-mono" font-size="14" fill="#000000" text-anchor="middle">GITHUB</text>
      </g>
    </a>
