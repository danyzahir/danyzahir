<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-stack" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2" fill="#000000" opacity="0.14" />
    </pattern>
    <style>
      .font-black { font-family: 'Space Grotesk', 'Impact', 'Arial Black', sans-serif; font-weight: 900; }
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 800; }
    </style>
  </defs>

  <!-- Outer Shadow & Base -->
  <rect x="14" y="14" width="822" height="302" fill="#000000" />
  <rect x="6" y="6" width="822" height="302" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  <rect x="6" y="6" width="822" height="302" fill="url(#dot-grid-stack)" />

  <!-- HEADER BAR -->
  <rect x="6" y="6" width="822" height="54" fill="#00E5FF" stroke="#000000" stroke-width="5" />
  <text x="24" y="41" class="font-black" font-size="22" fill="#000000" letter-spacing="1">TECH STACK &amp; CAPABILITIES MATRIX</text>
  
  <!-- Corner Badge -->
  <g transform="translate(660, 16)">
    <rect x="4" y="4" width="150" height="32" fill="#000000" />
    <rect x="0" y="0" width="150" height="32" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <text x="75" y="21" class="font-mono" font-size="12" fill="#000000" text-anchor="middle">FULL VECTOR SVG</text>
  </g>

  <!-- ROW 1: LANGUAGES -->
  <g transform="translate(24, 78)">
    <!-- Label -->
    <rect x="4" y="4" width="195" height="44" fill="#000000" />
    <rect x="0" y="0" width="195" height="44" fill="#FFE600" stroke="#000000" stroke-width="4" />
    <text x="16" y="27" class="font-black" font-size="14" fill="#000000">LANGUAGES</text>
    <!-- Value -->
    <rect x="210" y="4" width="585" height="44" fill="#000000" />
    <rect x="206" y="0" width="585" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <text x="222" y="27" class="font-mono" font-size="13" fill="#000000">PHP 8+  ///  JavaScript (ES6+)  ///  TypeScript  ///  HTML5  ///  CSS3  ///  SQL</text>
  </g>

  <!-- ROW 2: FRAMEWORKS -->
  <g transform="translate(24, 136)">
    <rect x="4" y="4" width="195" height="44" fill="#000000" />
    <rect x="0" y="0" width="195" height="44" fill="#7000FF" stroke="#000000" stroke-width="4" />
    <text x="16" y="27" class="font-black" font-size="14" fill="#FFFFFF">FRAMEWORKS</text>
    
    <rect x="210" y="4" width="585" height="44" fill="#000000" />
    <rect x="206" y="0" width="585" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <text x="222" y="27" class="font-mono" font-size="13" fill="#000000">Laravel  ///  React.js  ///  Next.js  ///  Vue.js  ///  TailwindCSS  ///  Bootstrap</text>
  </g>

  <!-- ROW 3: BACKEND & DATABASE -->
  <g transform="translate(24, 194)">
    <rect x="4" y="4" width="195" height="44" fill="#000000" />
    <rect x="0" y="0" width="195" height="44" fill="#00FF66" stroke="#000000" stroke-width="4" />
    <text x="16" y="27" class="font-black" font-size="14" fill="#000000">BACKEND &amp; DB</text>
    
    <rect x="210" y="4" width="585" height="44" fill="#000000" />
    <rect x="206" y="0" width="585" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <text x="222" y="27" class="font-mono" font-size="13" fill="#000000">MySQL  ///  PostgreSQL  ///  MongoDB  ///  Node.js  ///  Express.js  ///  REST API</text>
  </g>

  <!-- ROW 4: TOOLS & ENVIRONMENT -->
  <g transform="translate(24, 252)">
    <rect x="4" y="4" width="195" height="44" fill="#000000" />
    <rect x="0" y="0" width="195" height="44" fill="#FF6B00" stroke="#000000" stroke-width="4" />
    <text x="16" y="27" class="font-black" font-size="14" fill="#FFFFFF">TOOLS &amp; GEAR</text>
    
    <rect x="210" y="4" width="585" height="44" fill="#000000" />
    <rect x="206" y="0" width="585" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <text x="222" y="27" class="font-mono" font-size="13" fill="#000000">Git  ///  GitHub  ///  VS Code  ///  Laragon  ///  Postman  ///  Figma</text>
  </g>
</svg>
