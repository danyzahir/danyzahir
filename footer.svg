  <text x="417" y="68" class="font-mono" font-size="12" fill="#000000" text-anchor="middle" letter-spacing="0.5">DIBUAT DENGAN TEMA NEO-BRUTALISM /// TETAP BERANI &amp; TETAP KREATIF</text>
